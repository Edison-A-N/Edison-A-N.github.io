<text x="556" y="206" fill="#b71c1c" font-size="12" text-anchor="start" font-weight="normal">完整摘要</text>
<rect x="556" y="212" width="200" height="4" rx="2.5" fill="#f4b6bd"/>
<rect x="556" y="223" width="150" height="4" rx="2.5" fill="#f4b6bd"/>
<text x="468" y="246" fill="#9ca3af" font-size="11" text-anchor="start" font-weight="normal">每段预先写好几档，渲染时按年龄和重要度挑</text>
<text x="468" y="268" fill="#fca5a5" font-size="12" text-anchor="start" font-weight="normal">最近窗口：上下文越满，留得越短</text>
<text x="468" y="296" fill="#9ca3af" font-size="11" text-anchor="start" font-weight="normal">占用 30%</text>
<rect x="532" y="280" width="300" height="22" rx="4" fill="#111827" stroke="#4b5563" stroke-width="1.5" opacity="1"/>
<rect x="632" y="280" width="200" height="22" rx="4" fill="#ffebee" stroke="#c62828" stroke-width="1.5" opacity="1"/>
