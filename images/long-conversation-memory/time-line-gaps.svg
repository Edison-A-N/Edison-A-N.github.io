<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 880 420" role="img" aria-label="已有做法和少有人做的两点：衰减只决定排序和去留、最近窗口固定；按年龄和重要度挑摘要档位、最近窗口随上下文占用伸缩" style="max-width:880px">
<title>已有做法和少有人做的两点：衰减只决定排序和去留、最近窗口固定；按年龄和重要度挑摘要档位、最近窗口随上下文占用伸缩</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1d5db"/></marker>
</defs>
<style>text{font-family:-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif;}</style>
<rect x="0" y="0" width="880" height="420" rx="14" fill="#111827"/>
<text x="40" y="38" fill="#e5e7eb" font-size="15" text-anchor="start" font-weight="bold">时间线上：已有的做法，和少有人做的两点</text>
<rect x="24" y="56" width="404" height="340" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1.2"/>
