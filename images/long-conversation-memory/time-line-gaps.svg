<text x="50" y="139" fill="#424242" font-size="12" text-anchor="start" font-weight="normal">1. 记忆 A</text>
<rect x="130" y="132" width="110" height="5" rx="2.5" fill="#d4d4d4"/>
<rect x="40" y="152" width="220" height="24" rx="5" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5" opacity="1"/>
<text x="50" y="169" fill="#424242" font-size="12" text-anchor="start" font-weight="normal">2. 记忆 B</text>
<rect x="130" y="162" width="110" height="5" rx="2.5" fill="#d4d4d4"/>
<rect x="40" y="182" width="220" height="24" rx="5" fill="#111827" stroke="#4b5563" stroke-width="1.5" opacity="1"/>
<text x="50" y="199" fill="#9ca3af" font-size="12" text-anchor="start" font-weight="normal">3. 记忆 C</text>
<rect x="130" y="192" width="110" height="5" rx="2.5" fill="#374151"/>
<line x1="44" y1="194" x2="256" y2="194" stroke="#9ca3af" stroke-width="1.5"/>
<text x="272" y="138" fill="#9ca3af" font-size="11" text-anchor="start" font-weight="normal">Generative Agents：</text>
<text x="272" y="154" fill="#9ca3af" font-size="11" text-anchor="start" font-weight="normal">按分数排序</text>
<text x="272" y="184" fill="#9ca3af" font-size="11" text-anchor="start" font-weight="normal">MemoryBank：</text>
<text x="272" y="200" fill="#9ca3af" font-size="11" text-anchor="start" font-weight="normal">保留率低就丢</text>
<text x="40" y="246" fill="#9ca3af" font-size="11" text-anchor="start" font-weight="normal">每条记忆的内容本身不变</text>
<text x="40" y="268" fill="#e5e7eb" font-size="12" text-anchor="start" font-weight="normal">最近窗口：长度固定</text>
