<rect x="284" y="314" width="120" height="22" rx="4" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5" opacity="1"/>
<text x="40" y="364" fill="#9ca3af" font-size="11" text-anchor="start" font-weight="normal">占用 90%</text>
<rect x="104" y="348" width="300" height="22" rx="4" fill="#111827" stroke="#4b5563" stroke-width="1.5" opacity="1"/>
<rect x="284" y="348" width="120" height="22" rx="4" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5" opacity="1"/>
<text x="104" y="386" fill="#9ca3af" font-size="11" text-anchor="start" font-weight="normal">灰色：原样保留的最近窗口</text>
<text x="468" y="110" fill="#fca5a5" font-size="12" text-anchor="start" font-weight="normal">衰减决定的是：显示哪一档摘要</text>
<text x="468" y="138" fill="#9ca3af" font-size="11" text-anchor="start" font-weight="normal">旧、不重要</text>
<rect x="546" y="122" width="250" height="24" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="1.5" opacity="1"/>
<text x="556" y="138" fill="#b71c1c" font-size="12" text-anchor="start" font-weight="normal">一行锚点</text>
<text x="468" y="168" fill="#9ca3af" font-size="11" text-anchor="start" font-weight="normal">旧、重要</text>
<rect x="546" y="152" width="250" height="32" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="1.5" opacity="1"/>
<text x="556" y="168" fill="#b71c1c" font-size="12" text-anchor="start" font-weight="normal">简略摘要</text>
