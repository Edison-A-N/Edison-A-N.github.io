<rect x="532" y="314" width="300" height="22" rx="4" fill="#111827" stroke="#4b5563" stroke-width="1.5" opacity="1"/>
<rect x="702" y="314" width="130" height="22" rx="4" fill="#ffebee" stroke="#c62828" stroke-width="1.5" opacity="1"/>
<text x="468" y="364" fill="#9ca3af" font-size="11" text-anchor="start" font-weight="normal">占用 90%</text>
<rect x="532" y="348" width="300" height="22" rx="4" fill="#111827" stroke="#4b5563" stroke-width="1.5" opacity="1"/>
