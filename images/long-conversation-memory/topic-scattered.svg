<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 880 420" role="img" aria-label="同一个话题在第 10、80、200 轮各聊过一次，三段按时间各自变简略，话题索引一次查到三处，但三处详略不同" style="max-width:880px">
<title>同一个话题在第 10、80、200 轮各聊过一次，三段按时间各自变简略，话题索引一次查到三处，但三处详略不同</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1d5db"/></marker>
</defs>
<style>text{font-family:-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif;}</style>
<rect x="0" y="0" width="880" height="420" rx="14" fill="#111827"/>
<text x="40" y="38" fill="#e5e7eb" font-size="15" text-anchor="start" font-weight="bold">同一个话题散在三个时间段</text>
<line x1="60" y1="64" x2="830" y2="64" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="60" y="58" fill="#9ca3af" font-size="12" text-anchor="start" font-weight="normal">更早</text>
<text x="830" y="58" fill="#9ca3af" font-size="12" text-anchor="end" font-weight="normal">最近</text>
<rect x="60" y="232" width="120" height="18" rx="4" fill="#ffebee" stroke="#c62828" stroke-width="2" opacity="1"/>
<text x="120.0" y="246.0" fill="#b71c1c" font-size="12" text-anchor="middle" font-weight="normal">一行锚点</text>
<rect x="190" y="232" width="120" height="18" rx="4" fill="#374151" stroke="#6b7280" stroke-width="1" opacity="1"/>
<rect x="320" y="206" width="120" height="44" rx="4" fill="#ffebee" stroke="#c62828" stroke-width="2" opacity="1"/>
<text x="380.0" y="233.0" fill="#b71c1c" font-size="12" text-anchor="middle" font-weight="normal">简略摘要</text>
<rect x="450" y="190" width="120" height="60" rx="4" fill="#374151" stroke="#6b7280" stroke-width="1" opacity="1"/>
<rect x="580" y="166" width="120" height="84" rx="4" fill="#374151" stroke="#6b7280" stroke-width="1" opacity="1"/>
<text x="640.0" y="213.0" fill="#d1d5db" font-size="12" text-anchor="middle" font-weight="normal">完整摘要</text>
<rect x="710" y="100" width="120" height="150" rx="4" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2" opacity="1"/>
<text x="770.0" y="180.0" fill="#424242" font-size="12" text-anchor="middle" font-weight="normal">原文</text>
<line x1="56" y1="252" x2="836" y2="252" stroke="#9ca3af" stroke-width="1.2"/>
<text x="120.0" y="220" fill="#fca5a5" font-size="13" text-anchor="middle" font-weight="bold">第 10 轮</text>
<text x="380.0" y="194" fill="#fca5a5" font-size="13" text-anchor="middle" font-weight="bold">第 80 轮</text>
<text x="770.0" y="88" fill="#fca5a5" font-size="13" text-anchor="middle" font-weight="bold">第 200 轮</text>
<rect x="40" y="392" width="14" height="12" rx="2" fill="#374151" stroke="#6b7280"/>
<text x="62" y="403" fill="#9ca3af" font-size="12" text-anchor="start" font-weight="normal">灰色块：其他话题的段</text>
<path d="M330,332 A110.0,12 0 0 1 550,332 L550,386 A110.0,12 0 0 1 330,386 Z" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<ellipse cx="440.0" cy="332" rx="110.0" ry="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="440.0" y="364" fill="#0d47a1" font-size="14" text-anchor="middle" font-weight="bold">话题索引</text>
<text x="440.0" y="383" fill="#0d47a1" font-size="12" text-anchor="middle" font-weight="normal">一次查到三处</text>
<path d="M370,322 C370,290 120.0,290 120.0,256" fill="none" stroke="#d1d5db" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<path d="M440.0,322 C440.0,290 380.0,290 380.0,256" fill="none" stroke="#d1d5db" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<path d="M510,322 C510,290 770.0,290 770.0,256" fill="none" stroke="#d1d5db" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="600" y="352" fill="#fca5a5" font-size="13" text-anchor="start" font-weight="bold">取回来的三段</text>
<text x="600" y="372" fill="#fca5a5" font-size="13" text-anchor="start" font-weight="bold">详略不一样</text>
</svg>
