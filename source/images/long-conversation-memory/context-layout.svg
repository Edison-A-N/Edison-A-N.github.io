<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 880 600" role="img" aria-label="模型每次看到的上下文和上下文外面的存储：旧内容移出时原文存档并建索引；需要旧内容时才查索引，有命中才把原文放回上下文" style="max-width:880px">
<title>模型每次看到的上下文和上下文外面的存储：旧内容移出时原文存档并建索引；需要旧内容时才查索引，有命中才把原文放回上下文</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1d5db"/></marker>
</defs>
<style>text{font-family:-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif;}</style>
<rect x="0" y="0" width="880" height="600" rx="14" fill="#111827"/>
<text x="40" y="38" fill="#e5e7eb" font-size="15" text-anchor="start" font-weight="bold">模型每次看到的上下文</text>
<text x="606" y="38" fill="#e5e7eb" font-size="15" text-anchor="start" font-weight="bold">上下文外面</text>
<line x1="36" y1="66" x2="36" y2="548" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="36" y="60" fill="#9ca3af" font-size="12" text-anchor="middle" font-weight="normal">更早</text>
<text x="36" y="570" fill="#9ca3af" font-size="12" text-anchor="middle" font-weight="normal">最近</text>
<rect x="58" y="56" width="452" height="186" rx="10" fill="none" stroke="#ef5350" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="74" y="80" fill="#fca5a5" font-size="13" text-anchor="start" font-weight="bold">较早的段：越旧越简略</text>
<rect x="74" y="92" width="420" height="28" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.5" opacity="1"/>
<text x="88" y="111" fill="#b71c1c" font-size="13" text-anchor="start" font-weight="normal">段 1　一行锚点</text>
<rect x="74" y="128" width="420" height="44" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.5" opacity="1"/>
<text x="88" y="147" fill="#b71c1c" font-size="13" text-anchor="start" font-weight="normal">段 2　简略摘要</text>
<rect x="88" y="157" width="220" height="5" rx="2.5" fill="#f4b6bd"/>
<rect x="74" y="180" width="420" height="52" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.5" opacity="1"/>
<text x="88" y="199" fill="#b71c1c" font-size="13" text-anchor="start" font-weight="normal">段 3　完整摘要</text>
<rect x="88" y="208" width="330" height="5" rx="2.5" fill="#f4b6bd"/>
<rect x="88" y="219" width="280" height="5" rx="2.5" fill="#f4b6bd"/>
<rect x="58" y="256" width="452" height="186" rx="10" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="74" y="280" fill="#e5e7eb" font-size="13" text-anchor="start" font-weight="bold">最近一段：原文，不压缩</text>
<rect x="74" y="292" width="250" height="32" rx="10" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5" opacity="1"/>
<text x="88" y="313" fill="#424242" font-size="12" text-anchor="start" font-weight="normal">用户</text>
<rect x="124" y="306" width="180" height="5" rx="2.5" fill="#d4d4d4"/>
<rect x="244" y="332" width="250" height="32" rx="10" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5" opacity="1"/>
<text x="258" y="353" fill="#424242" font-size="12" text-anchor="start" font-weight="normal">助手</text>
<rect x="294" y="346" width="180" height="5" rx="2.5" fill="#d4d4d4"/>
<rect x="238" y="370" width="262" height="66" rx="8" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="244" y="375" width="250" height="24" rx="6" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5" opacity="1"/>
<text x="258" y="392" fill="#424242" font-size="12" text-anchor="start" font-weight="normal">工具调用</text>
<rect x="244" y="404" width="250" height="26" rx="6" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5" opacity="1"/>
<text x="258" y="422" fill="#424242" font-size="12" text-anchor="start" font-weight="normal">工具结果</text>
<rect x="322" y="415" width="150" height="5" rx="2.5" fill="#d4d4d4"/>
<text x="226" y="400" fill="#9ca3af" font-size="12" text-anchor="end" font-weight="normal">调用和结果</text>
<text x="226" y="418" fill="#9ca3af" font-size="12" text-anchor="end" font-weight="normal">不拆到边界两侧</text>
<rect x="74" y="452" width="426" height="36" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" stroke-dasharray="6 3" opacity="1"/>
<text x="88" y="475" fill="#0d47a1" font-size="13" text-anchor="start" font-weight="bold">③ 有命中时才放回：相关原文，和新消息一起交给模型</text>
<rect x="74" y="498" width="256" height="38" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="2.5" opacity="1"/>
<text x="88" y="522" fill="#111827" font-size="13" text-anchor="start" font-weight="bold">新消息</text>
<rect x="140" y="515" width="170" height="5" rx="2.5" fill="#d4d4d4"/>
<rect x="590" y="56" width="268" height="532" rx="10" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="6 4"/>
<path d="M610,88 A114.0,12 0 0 1 838,88 L838,214 A114.0,12 0 0 1 610,214 Z" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<ellipse cx="724.0" cy="88" rx="114.0" ry="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="724" y="136" fill="#0d47a1" font-size="14" text-anchor="middle" font-weight="bold">完整的原始记录</text>
<text x="724" y="158" fill="#0d47a1" font-size="12" text-anchor="middle" font-weight="normal">每条消息原样存着</text>
<text x="724" y="176" fill="#0d47a1" font-size="12" text-anchor="middle" font-weight="normal">摘要变短，原文不丢</text>
<rect x="610" y="410" width="228" height="116" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2" opacity="1"/>
<text x="724" y="438" fill="#b71c1c" font-size="14" text-anchor="middle" font-weight="bold">内容索引</text>
<rect x="628" y="452" width="48" height="22" rx="11" fill="#ffffff" stroke="#c62828" stroke-width="1"/>
<text x="652.0" y="468" fill="#b71c1c" font-size="12" text-anchor="middle" font-weight="normal">标签</text>
<rect x="684" y="452" width="92" height="22" rx="11" fill="#ffffff" stroke="#c62828" stroke-width="1"/>
<text x="730.0" y="468" fill="#b71c1c" font-size="12" text-anchor="middle" font-weight="normal">embedding</text>
<rect x="784" y="452" width="36" height="22" rx="11" fill="#ffffff" stroke="#c62828" stroke-width="1"/>
<text x="802.0" y="468" fill="#b71c1c" font-size="12" text-anchor="middle" font-weight="normal">图</text>
<text x="724" y="502" fill="#b71c1c" font-size="12" text-anchor="middle" font-weight="normal">同一话题的内容归在一起</text>
<line x1="724" y1="406" x2="724" y2="232" stroke="#d1d5db" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="732" y="300" fill="#e5e7eb" font-size="12" text-anchor="start" font-weight="normal">每条索引</text>
<text x="732" y="316" fill="#e5e7eb" font-size="12" text-anchor="start" font-weight="normal">指向原文</text>
<line x1="512" y1="118" x2="606" y2="118" stroke="#d1d5db" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="559" y="96" fill="#e5e7eb" font-size="12" text-anchor="middle" font-weight="normal">① 移出时</text>
<text x="559" y="111" fill="#e5e7eb" font-size="12" text-anchor="middle" font-weight="normal">存原文、建索引</text>
<path d="M606,210 L566,210 L566,470 L504,470" fill="none" stroke="#d1d5db" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="560" y="330" fill="#e5e7eb" font-size="12" text-anchor="end" font-weight="normal">③ 命中的</text>
<text x="560" y="346" fill="#e5e7eb" font-size="12" text-anchor="end" font-weight="normal">原文放回</text>
<line x1="332" y1="517" x2="606" y2="506" stroke="#d1d5db" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="470" y="536" fill="#e5e7eb" font-size="12" text-anchor="middle" font-weight="normal">② 需要旧内容时才查</text>
<text x="724" y="560" fill="#9ca3af" font-size="11" text-anchor="middle" font-weight="normal">模型调用检索工具，或系统每轮自动查、</text>
<text x="724" y="575" fill="#9ca3af" font-size="11" text-anchor="middle" font-weight="normal">相关度不够就不放回</text>
</svg>
