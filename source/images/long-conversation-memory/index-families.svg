<text x="310" y="414" fill="#e5e7eb" font-size="12" text-anchor="start" font-weight="normal">写入时：每段算 embedding，相近的归成一簇</text>
<text x="310" y="434" fill="#e5e7eb" font-size="12" text-anchor="start" font-weight="normal">查询时：找最相近的簇和段</text>
<text x="310" y="456" fill="#93c5fd" font-size="12" text-anchor="start" font-weight="normal">RAPTOR、MemTree、Think-in-Memory</text>
