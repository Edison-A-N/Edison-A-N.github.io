<text x="588" y="434" fill="#e5e7eb" font-size="12" text-anchor="start" font-weight="normal">查询时：从实体出发，沿边扩散</text>
<text x="588" y="456" fill="#93c5fd" font-size="12" text-anchor="start" font-weight="normal">HippoRAG、Zep、Mem0 图版本</text>
