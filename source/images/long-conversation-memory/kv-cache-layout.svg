<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 880 332" role="img" aria-label="KV 缓存装不下超长输入时的安排：开头几个 token 一直留着，中间的旧内容压缩、丢弃或存到外面，最近窗口原样保留且长度固定" style="max-width:880px">
